# Which paths each role may change. The driver names an agent's branch when it starts
# the agent, so the role follows from the branch. The first matching pattern wins.
branches:
  "build/*": builder
  "spec/*": spec-author
  "*": person
# Patterns cover every example under examples/; `*` also matches `/`.
roles:
  builder:
    allow: ["examples/*/src/*", "docs/*", "README.md"]
    deny: ["examples/*/spec/*", "examples/*/conformance/*", "examples/*/checks/*",
           "examples/*/mutation/*", "tools/*", "integrations/*", "verify", "policy.yaml",
           ".claude/*", ".github/*", ".gitlab/*", ".gitlab-ci.yml", "CODEOWNERS"]
  spec-author:
    allow: ["examples/*/spec/*", "examples/*/checks/*", "examples/*/conformance/*"]
    deny: ["examples/*/src/*"]
  person:
    allow: ["*"]
