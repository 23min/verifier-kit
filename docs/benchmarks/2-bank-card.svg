<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 1000" width="860" height="1000">
  <title>ASN bank card, Maestro application (Aarts, de Ruiter and Poll, 2013)</title>
  <style>
    :root {
      --surface: #ffffff; --node: #e4e4e4; --ink: #141414; --ink-2: #333333; --muted: #6a6a6a; --rule: #b4b4b4;
      --serif: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #161616; --node: #2c2c2c; --ink: #ececec; --ink-2: #cfcfcf; --muted: #9d9d9d; --rule: #4a4a4a; }
    }
    .bg { fill: var(--surface); }
    .st { fill: var(--node); stroke: var(--ink); stroke-width: 1.4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.15; }
    .mk { fill: var(--ink-2); }
    .sn { font: italic 400 20px var(--serif); fill: var(--ink); }
    .sub { font-style: normal; font-size: 14px; }
    .lb { font: 400 14px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
    .ti { font: 400 17px var(--serif); fill: var(--ink); }
    .nt { font: 400 13px var(--serif); fill: var(--muted); }
    .kh { font: 400 13px var(--serif); fill: var(--ink); }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk" d="M0,0 L10,4 L0,8 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="1000"/>
  <text class="ti" x="24" y="34">ASN bank card, Maestro application (Aarts, de Ruiter and Poll, 2013)</text>
