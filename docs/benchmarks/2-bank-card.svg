  <text class="sn" x="559" y="386" text-anchor="middle">s<tspan class="sub" dy="4">2</tspan></text>
  <circle class="st" cx="790" cy="220" r="24"/>
  <text class="sn" x="789" y="226" text-anchor="middle">s<tspan class="sub" dy="4">4</tspan></text>
  <circle class="st" cx="790" cy="540" r="24"/>
  <text class="sn" x="789" y="546" text-anchor="middle">s<tspan class="sub" dy="4">5</tspan></text>
  <circle class="st" cx="1000" cy="380" r="24"/>
  <text class="sn" x="999" y="386" text-anchor="middle">s<tspan class="sub" dy="4">3</tspan></text>
  <text class="nt" x="24" y="866" text-anchor="start"><tspan x="24" dy="0">SELECT = selectApplication · GPO = getProcessingOptions · GPO′ = getProcessingOptionsInvalid · GD = getValidData · GD′ = getInvalidData</tspan><tspan x="24" dy="17">RR = readValidRecord · RR′ = readInvalidRecord · IA = internalAuthenticate · AC1(x) = generateACFirstx · AC2(x) = generateACSecondx</tspan><tspan x="24" dy="17">other: every input that no other edge from the same state names. Outputs are the card&#x27;s status words.</tspan></text>
</svg>
