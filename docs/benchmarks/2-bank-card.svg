  <text class="lb" x="470" y="640" text-anchor="middle"><tspan x="470" dy="0">AC2(AAC, TC, ARQC) / 6700</tspan><tspan x="470" dy="17">GPO, GPO′, IA / 6985</tspan><tspan x="470" dy="17">GD′ / 6A88</tspan><tspan x="470" dy="17">RR′ / 6A82</tspan><tspan x="470" dy="17">SELECT / 9000</tspan></text>
  <path class="e" d="M801.3,384.0 C830.0,930.0 240.0,930.0 268.7,385.0" marker-end="url(#arr)"/>
