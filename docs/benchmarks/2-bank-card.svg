  <path class="e" d="M487.9,375.9 Q560.0,440.0 631.3,503.4" marker-end="url(#arr)"/>
  <text class="lb" x="512" y="387" text-anchor="start"><tspan x="512" dy="0">IA / 9000</tspan></text>
  <path class="e" d="M666.4,217.5 Q725.0,280.0 782.9,341.8" marker-end="url(#arr)"/>
  <text class="lb" x="734" y="250" text-anchor="start"><tspan x="734" dy="0">AC2(TC, AAC) /</tspan><tspan x="734" dy="17">900000</tspan></text>
  <path class="e" d="M666.4,502.5 Q725.0,440.0 782.9,378.2" marker-end="url(#arr)"/>
  <text class="lb" x="724" y="458" text-anchor="middle"><tspan x="724" dy="0">AC1(AAC) / 900000</tspan></text>
  <path class="e" d="M650.0,496.0 Q650.0,360.0 650.0,225.0" marker-end="url(#arr)"/>
  <text class="lb" x="650" y="410" text-anchor="middle"><tspan x="650" dy="0">AC1(TC, ARQC) /</tspan><tspan x="650" dy="17">900080</tspan></text>
  <path class="e" d="M660.4,541.6 C705.4,583.2 594.6,583.2 639.1,542.5" marker-end="url(#arr)"/>
  <text class="lb" x="650" y="600" text-anchor="middle"><tspan x="650" dy="0">GD, RR / 9000</tspan></text>
  <path class="e" d="M626.5,195.3 Q405.7,151.0 283.6,339.0" marker-end="url(#arr)"/>
  <text class="lb" x="430" y="136" text-anchor="middle"><tspan x="430" dy="0">AC1(ARQC), AC2(ARQC) / 6A86</tspan><tspan x="430" dy="17">AC1(AAC, TC) / 6700</tspan><tspan x="430" dy="17">SELECT / 9000</tspan><tspan x="430" dy="17">other / 6985</tspan></text>
