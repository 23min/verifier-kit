  <text class="sn" x="649" y="206" text-anchor="middle">s<tspan class="sub" dy="4">4</tspan></text>
  <circle class="st" cx="650" cy="520" r="24"/>
  <text class="sn" x="649" y="526" text-anchor="middle">s<tspan class="sub" dy="4">5</tspan></text>
  <circle class="st" cx="800" cy="360" r="24"/>
  <text class="sn" x="799" y="366" text-anchor="middle">s<tspan class="sub" dy="4">3</tspan></text>
  <text class="nt" x="24" y="890" text-anchor="start"><tspan x="24" dy="0">SELECT = selectApplication · GPO = getProcessingOptions · GPO′ = getProcessingOptionsInvalid</tspan><tspan x="24" dy="17">GD = getValidData · GD′ = getInvalidData · RR = readValidRecord · RR′ = readInvalidRecord</tspan><tspan x="24" dy="17">IA = internalAuthenticate · AC1(x) = generateACFirstx · AC2(x) = generateACSecondx</tspan><tspan x="24" dy="17">other: every input that no other edge from the same state names. Outputs are the card&#x27;s status words.</tspan></text>
</svg>
