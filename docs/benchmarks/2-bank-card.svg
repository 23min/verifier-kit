  <text class="lb" x="660" y="270" text-anchor="end"><tspan x="660" dy="0">AC1(TC, ARQC) / 900080</tspan></text>
  <path class="e" d="M579.7,393.7 Q675.0,460.0 769.5,525.7" marker-end="url(#arr)"/>
  <text class="lb" x="660" y="488" text-anchor="end"><tspan x="660" dy="0">IA / 9000</tspan></text>
  <path class="e" d="M809.1,234.5 Q895.0,300.0 980.1,364.8" marker-end="url(#arr)"/>
  <text class="lb" x="912" y="268" text-anchor="start"><tspan x="912" dy="0">AC2(TC, AAC) /</tspan><tspan x="912" dy="16">900000</tspan></text>
  <path class="e" d="M809.1,525.5 Q895.0,460.0 980.1,395.2" marker-end="url(#arr)"/>
  <text class="lb" x="846" y="548" text-anchor="start"><tspan x="846" dy="0">AC1(AAC) / 900000</tspan></text>
  <path class="e" d="M790.0,516.0 Q790.0,380.0 790.0,245.0" marker-end="url(#arr)"/>
  <text class="lb" x="778" y="330" text-anchor="end"><tspan x="778" dy="0">AC1(TC, ARQC) /</tspan><tspan x="778" dy="16">900080</tspan></text>
  <path class="e" d="M800.4,561.6 C845.4,603.2 734.6,603.2 779.1,562.5" marker-end="url(#arr)"/>
  <text class="lb" x="790" y="617" text-anchor="middle"><tspan x="790" dy="0">GD, RR / 9000</tspan></text>
  <path class="e" d="M766.2,216.7 Q519.3,182.9 347.3,362.0" marker-end="url(#arr)"/>
  <text class="lb" x="500" y="152" text-anchor="middle"><tspan x="500" dy="0">AC1(ARQC), AC2(ARQC) / 6A86</tspan><tspan x="500" dy="16">AC1(AAC, TC) / 6700</tspan><tspan x="500" dy="16">SELECT / 9000</tspan><tspan x="500" dy="16">other / 6985</tspan></text>
  <path class="e" d="M770.2,553.6 C600.0,670.0 360.0,650.0 332.8,404.8" marker-end="url(#arr)"/>
  <text class="lb" x="566" y="652" text-anchor="middle"><tspan x="566" dy="0">AC2(AAC, TC, ARQC) / 6700</tspan><tspan x="566" dy="16">GPO, GPO′, IA / 6985</tspan><tspan x="566" dy="16">GD′ / 6A88</tspan><tspan x="566" dy="16">RR′ / 6A82</tspan><tspan x="566" dy="16">SELECT / 9000</tspan></text>
  <path class="e" d="M1000.0,404.0 C1000.0,900.0 300.0,900.0 328.6,405.0" marker-end="url(#arr)"/>
  <text class="lb" x="660" y="812" text-anchor="middle"><tspan x="660" dy="0">SELECT / 9000</tspan><tspan x="660" dy="16">other / 6985</tspan></text>
  <circle class="st" cx="100" cy="380" r="24"/>
  <text class="sn" x="99" y="386" text-anchor="middle">s<tspan class="sub" dy="4">0</tspan></text>
