  <text class="nt" x="748" y="252" text-anchor="end"><tspan x="748" dy="0">C, D, DT /</tspan><tspan x="748" dy="17">ConnectionClosed</tspan><tspan x="748" dy="17">from s1 and s3 to s9</tspan></text>
  <text class="nt" x="24" y="912" text-anchor="start"><tspan x="24" dy="0">C = Connect · D = Disconnect · DT = DisconnectTCP · P0, P1 = PublishQoS0, PublishQoS1 · PR = PublishRetain</tspan><tspan x="24" dy="17">DR = DeleteRetained · S, U = Subscribe, UnSubScribe · SR, UR = SubscribeRetained, UnSubScribeRetained</tspan><tspan x="24" dy="17">m0, m1 = Pub(my_topic,messageQos0), Pub(my_topic,messageQos1) · r = Pub(my_topic/retained,retained_message)</tspan><tspan x="24" dy="17">e = Pub(my_topic/retained,) · x+y: x, then y (the model writes x__y)</tspan><tspan x="24" dy="17">Not drawn: C, D and DT lead every state but s0 and s2 to s2, answering ConnectionClosed.</tspan><tspan x="24" dy="17">other: every input that no other edge from s0 names.</tspan></text>
