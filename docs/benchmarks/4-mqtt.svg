  <text class="nt" x="912" y="248" text-anchor="start"><tspan x="912" dy="0">C, D, DT /</tspan><tspan x="912" dy="16">ConnectionClosed</tspan><tspan x="912" dy="16">from s1 and s3 to s9</tspan></text>
  <text class="nt" x="24" y="930" text-anchor="start"><tspan x="24" dy="0">C = Connect · D = Disconnect · DT = DisconnectTCP · P0, P1 = PublishQoS0, PublishQoS1 · PR = PublishRetain · DR = DeleteRetained</tspan><tspan x="24" dy="17">S, U = Subscribe, UnSubScribe · SR, UR = SubscribeRetained, UnSubScribeRetained · m0, m1 = Pub(my_topic,messageQos0), Pub(my_topic,messageQos1)</tspan><tspan x="24" dy="17">r = Pub(my_topic/retained,retained_message) · e = Pub(my_topic/retained,) · x+y: x, then y (the model writes x__y)</tspan><tspan x="24" dy="17">Not drawn: C, D and DT lead every state but s0 and s2 to s2, answering ConnectionClosed. other: every input that no other edge from s0 names.</tspan></text>
