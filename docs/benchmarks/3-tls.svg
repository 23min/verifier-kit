<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470">
  <title>mbedTLS 2.0.0 as a TLS 1.0 server (Janssen, 2021)</title>
  <style>
    :root {
      --surface: #ffffff; --node: #e4e4e4; --ink: #141414; --ink-2: #333333; --muted: #6a6a6a; --rule: #b4b4b4;
      --serif: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #161616; --node: #2c2c2c; --ink: #ececec; --ink-2: #cfcfcf; --muted: #9d9d9d; --rule: #4a4a4a; }
    }
    .bg { fill: var(--surface); }
    .st { fill: var(--node); stroke: var(--ink); stroke-width: 1.4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.15; }
    .mk { fill: var(--ink-2); }
    .sn { font: italic 400 19px var(--serif); fill: var(--ink); }
    .sub { font-style: normal; font-size: 13px; }
    .lb { font: 400 13px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
    .ti { font: 400 17px var(--serif); fill: var(--ink); }
    .nt { font: 400 12.5px var(--serif); fill: var(--muted); }
    .kh { font: 400 12.5px var(--serif); fill: var(--ink); }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk" d="M0,0 L10,4 L0,8 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="1060" height="470"/>
  <text class="ti" x="24" y="34">mbedTLS 2.0.0 as a TLS 1.0 server (Janssen, 2021)</text>
  <path class="e" d="M36.0,170.0 L75.0,170.0" marker-end="url(#arr)"/>
  <path class="e" d="M124.0,170.0 Q215.0,170.0 305.0,170.0" marker-end="url(#arr)"/>
  <text class="lb" x="215" y="110" text-anchor="middle"><tspan x="215" dy="0">ClientHello /</tspan><tspan x="215" dy="16">SERVER_HELLO|CERTIFICATE|</tspan><tspan x="215" dy="16">SERVER_HELLO_DONE</tspan></text>
  <path class="e" d="M354.0,170.0 Q445.0,170.0 535.0,170.0" marker-end="url(#arr)"/>
  <text class="lb" x="445" y="158" text-anchor="middle"><tspan x="445" dy="0">RSAClientKeyExchange / -</tspan></text>
  <path class="e" d="M584.0,170.0 Q675.0,170.0 765.0,170.0" marker-end="url(#arr)"/>
  <text class="lb" x="675" y="158" text-anchor="middle"><tspan x="675" dy="0">ChangeCipherSpec / -</tspan></text>
  <path class="e" d="M814.0,170.0 Q875.0,170.0 935.0,170.0" marker-end="url(#arr)"/>
  <text class="lb" x="875" y="110" text-anchor="middle"><tspan x="875" dy="0">Finished /</tspan><tspan x="875" dy="16">CHANGE_CIPHER_SPEC|</tspan><tspan x="875" dy="16">FINISHED</tspan></text>
  <path class="e" d="M970.4,191.6 C1015.4,233.2 904.6,233.2 949.1,192.5" marker-end="url(#arr)"/>
  <text class="lb" x="1036" y="250" text-anchor="end"><tspan x="1036" dy="0">ClientHello /</tspan><tspan x="1036" dy="16">ALERT_WARNING_NO_RENEGOTIATION</tspan></text>
  <path class="e" d="M251.6,349.6 C293.2,304.6 293.2,415.4 252.5,370.9" marker-end="url(#arr)"/>
  <text class="lb" x="294" y="365" text-anchor="start"><tspan x="294" dy="0">any input / ConnectionClosed</tspan></text>
  <circle class="st" cx="100" cy="170" r="24"/>
  <text class="sn" x="99" y="176" text-anchor="middle">s<tspan class="sub" dy="4">0</tspan></text>
  <circle class="st" cx="330" cy="170" r="24"/>
  <text class="sn" x="329" y="176" text-anchor="middle">s<tspan class="sub" dy="4">2</tspan></text>
  <circle class="st" cx="560" cy="170" r="24"/>
  <text class="sn" x="559" y="176" text-anchor="middle">s<tspan class="sub" dy="4">3</tspan></text>
  <circle class="st" cx="790" cy="170" r="24"/>
  <text class="sn" x="789" y="176" text-anchor="middle">s<tspan class="sub" dy="4">4</tspan></text>
  <circle class="st" cx="960" cy="170" r="24"/>
  <text class="sn" x="959" y="176" text-anchor="middle">s<tspan class="sub" dy="4">5</tspan></text>
  <circle class="st" cx="230" cy="360" r="24"/>
  <text class="sn" x="229" y="366" text-anchor="middle">s<tspan class="sub" dy="4">1</tspan></text>
  <path class="e" stroke-dasharray="4 4" d="M230,262 L230.0,335.0" marker-end="url(#arr)"/>
  <text class="nt" x="242" y="276" text-anchor="start"><tspan x="242" dy="0">from every other state</tspan></text>
  <text class="nt" x="24" y="420" text-anchor="start"><tspan x="24" dy="0">Not drawn: from every other state, each input that no drawn edge names leads to s1, the closed connection, answering</tspan><tspan x="24" dy="17">ConnectionClosed; from s5 the answer is APPLICATION|ALERT_WARNING_CLOSE_NOTIFY|ConnectionClosed. A - is the model&#x27;s own output: no reply.</tspan></text>
</svg>
