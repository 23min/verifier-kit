<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500">
  <title>mbedTLS 2.0.0 as a TLS 1.0 server (Janssen, 2021)</title>
  <style>
    :root {
      --surface: #ffffff; --node: #e4e4e4; --ink: #141414; --ink-2: #333333; --muted: #6a6a6a; --rule: #b4b4b4;
      --serif: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #161616; --node: #2c2c2c; --ink: #ececec; --ink-2: #cfcfcf; --muted: #9d9d9d; --rule: #4a4a4a; }
    }
    .bg { fill: var(--surface); }
    .st { fill: var(--node); stroke: var(--ink); stroke-width: 1.4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.15; }
    .mk { fill: var(--ink-2); }
    .sn { font: italic 400 20px var(--serif); fill: var(--ink); }
    .sub { font-style: normal; font-size: 14px; }
    .lb { font: 400 14px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
    .ti { font: 400 17px var(--serif); fill: var(--ink); }
    .nt { font: 400 13px var(--serif); fill: var(--muted); }
    .kh { font: 400 13px var(--serif); fill: var(--ink); }
    .rule { stroke: var(--rule); stroke-width: 1; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk" d="M0,0 L10,4 L0,8 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="500"/>
  <text class="ti" x="24" y="34">mbedTLS 2.0.0 as a TLS 1.0 server (Janssen, 2021)</text>
  <path class="e" d="M26.0,200.0 L65.0,200.0" marker-end="url(#arr)"/>
  <path class="e" d="M114.0,200.0 Q175.0,200.0 235.0,200.0" marker-end="url(#arr)"/>
  <text class="lb" x="175" y="132" text-anchor="middle"><tspan x="175" dy="0">ClientHello /</tspan><tspan x="175" dy="17">SERVER_HELLO|CERTIFICATE|</tspan><tspan x="175" dy="17">SERVER_HELLO_DONE</tspan></text>
  <path class="e" d="M284.0,200.0 Q345.0,200.0 405.0,200.0" marker-end="url(#arr)"/>
  <text class="lb" x="345" y="246" text-anchor="middle"><tspan x="345" dy="0">RSAClientKeyExchange / -</tspan></text>
  <path class="e" d="M454.0,200.0 Q515.0,200.0 575.0,200.0" marker-end="url(#arr)"/>
  <text class="lb" x="515" y="168" text-anchor="middle"><tspan x="515" dy="0">ChangeCipherSpec / -</tspan></text>
  <path class="e" d="M624.0,200.0 Q685.0,200.0 745.0,200.0" marker-end="url(#arr)"/>
  <text class="lb" x="685" y="132" text-anchor="middle"><tspan x="685" dy="0">Finished /</tspan><tspan x="685" dy="17">CHANGE_CIPHER_SPEC|</tspan><tspan x="685" dy="17">FINISHED</tspan></text>
  <path class="e" d="M780.4,221.6 C825.4,263.2 714.6,263.2 759.1,222.5" marker-end="url(#arr)"/>
  <text class="lb" x="846" y="290" text-anchor="end"><tspan x="846" dy="0">ClientHello /</tspan><tspan x="846" dy="17">ALERT_WARNING_NO_RENEGOTIATION</tspan></text>
  <path class="e" d="M221.6,369.6 C263.2,324.6 263.2,435.4 222.5,390.9" marker-end="url(#arr)"/>
  <text class="lb" x="264" y="385" text-anchor="start"><tspan x="264" dy="0">any input / ConnectionClosed</tspan></text>
  <circle class="st" cx="90" cy="200" r="24"/>
  <text class="sn" x="89" y="206" text-anchor="middle">s<tspan class="sub" dy="4">0</tspan></text>
  <circle class="st" cx="260" cy="200" r="24"/>
  <text class="sn" x="259" y="206" text-anchor="middle">s<tspan class="sub" dy="4">2</tspan></text>
  <circle class="st" cx="430" cy="200" r="24"/>
  <text class="sn" x="429" y="206" text-anchor="middle">s<tspan class="sub" dy="4">3</tspan></text>
  <circle class="st" cx="600" cy="200" r="24"/>
  <text class="sn" x="599" y="206" text-anchor="middle">s<tspan class="sub" dy="4">4</tspan></text>
  <circle class="st" cx="770" cy="200" r="24"/>
  <text class="sn" x="769" y="206" text-anchor="middle">s<tspan class="sub" dy="4">5</tspan></text>
  <circle class="st" cx="200" cy="380" r="24"/>
  <text class="sn" x="199" y="386" text-anchor="middle">s<tspan class="sub" dy="4">1</tspan></text>
  <path class="e" stroke-dasharray="4 4" d="M200,282 L200.0,355.0" marker-end="url(#arr)"/>
  <text class="nt" x="212" y="296" text-anchor="start"><tspan x="212" dy="0">from every other state</tspan></text>
  <text class="nt" x="24" y="444" text-anchor="start"><tspan x="24" dy="0">Not drawn: from every other state, each input that no drawn edge names leads to s1, the closed connection,</tspan><tspan x="24" dy="17">answering ConnectionClosed; from s5 the answer is APPLICATION|ALERT_WARNING_CLOSE_NOTIFY|ConnectionClosed.</tspan><tspan x="24" dy="17">A - is the model&#x27;s own output: no reply.</tspan></text>
</svg>
