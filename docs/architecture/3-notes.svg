<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700">
  <title>How the notes example's files are tied together</title>
  <style>
    :root {
      --surface: #ffffff; --ink: #15202b; --ink-2: #3b4755; --muted: #5a6676;
      --line: #c6ced8; --line-2: #8a96a5;
      --you: #e7e3f7; --you-s: #6556b0;
      --code: #f8e3e8; --code-s: #b0465c;
      --prog: #ddefe3; --prog-s: #2f7a4c;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #151d26; --ink: #e2e8ee; --ink-2: #b6c1cd; --muted: #95a3b2;
        --line: #33404f; --line-2: #627082;
        --you: #272245; --you-s: #a99df2;
        --code: #3a1d26; --code-s: #ec8fa3;
        --prog: #14291d; --prog-s: #6fc593;
      }
    }
    .bg { fill: var(--surface); stroke: var(--line); }
    .n { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
    .n.you { fill: var(--you); stroke: var(--you-s); }
    .n.code { fill: var(--code); stroke: var(--code-s); }
    .n.prog { fill: var(--prog); stroke: var(--prog-s); }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
    .e.dash { stroke-dasharray: 5 4; }
    .mk { fill: var(--ink-2); }
    .tm { font: 600 14px var(--font-mono); fill: var(--ink); }
    .ts { font: 400 14px var(--font-body); fill: var(--muted); }
    .tl { font: 400 14px var(--font-body); fill: var(--ink-2); }
    /* An edge label carries a halo in the colour beneath it, so a line that
       passes under the text does not strike through it. */
    .te { font: 400 14px var(--font-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="notes-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="859" height="699" rx="10"/>

  <!-- From prose to the spine -->
  <rect class="n you" x="32" y="20" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="43" text-anchor="middle">spec/notes/chapter.md</text>
  <text class="ts" x="182" y="63" text-anchor="middle">prose</text>
  <path class="e" d="M182,76 V130" marker-end="url(#notes-arrow)"/>
  <text class="te" x="190" y="108">read by two interpreters</text>

  <rect class="n you" x="32" y="132" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="155" text-anchor="middle">spec/notes/readings/*.yaml</text>
  <text class="ts" x="182" y="175" text-anchor="middle">two readings</text>
  <path class="e" d="M182,188 V242" marker-end="url(#notes-arrow)"/>
  <text class="te" x="190" y="220">spine diff; a person ratifies</text>

  <rect class="n you" x="568" y="132" width="260" height="56" rx="6"/>
  <text class="tm" x="698" y="155" text-anchor="middle">spec/notes/behaviors/</text>
  <text class="ts" x="698" y="175" text-anchor="middle">valid/ and invalid/</text>
  <path class="e" d="M600,188 V258 H334" marker-end="url(#notes-arrow)"/>
  <text class="te" x="608" y="228">spine behaviors replays them</text>

  <rect class="n you" x="32" y="244" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="267" text-anchor="middle">spec/notes/spine.yaml</text>
  <text class="ts" x="182" y="287" text-anchor="middle">ratified spine</text>

  <!-- From the spine to the code -->
  <path class="e" d="M182,300 V354" marker-end="url(#notes-arrow)"/>
  <text class="te" x="190" y="332">spine conform: every case, margin 1</text>

  <rect class="n you" x="32" y="356" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="379" text-anchor="middle">conformance/adapter_notes.py</text>
  <text class="ts" x="182" y="399" text-anchor="middle">new, apply, observe</text>
  <path class="e" d="M182,412 V466" marker-end="url(#notes-arrow)"/>
  <text class="te" x="190" y="444">imports and calls</text>

  <rect class="n code" x="32" y="468" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="491" text-anchor="middle">src/notes_app.py</text>
  <text class="ts" x="182" y="511" text-anchor="middle">the service</text>

  <!-- The content checks -->
  <rect class="n you" x="568" y="476" width="260" height="40" rx="6"/>
  <text class="tm" x="698" y="501" text-anchor="middle">checks/notes/test_content.py</text>
  <path class="e" d="M568,496 H334" marker-end="url(#notes-arrow)"/>
  <text class="te" x="451" y="488" text-anchor="middle">imports</text>
  <path class="e dash" d="M720,476 V286 H334" marker-end="url(#notes-arrow)"/>
  <text class="te" x="712" y="372" text-anchor="end">cite cells as covers:</text>
  <text class="te" x="712" y="390" text-anchor="end">state/event@hash</text>

  <!-- The mutants -->
  <rect class="n you" x="32" y="580" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="603" text-anchor="middle">mutation/mutants.yaml</text>
  <text class="ts" x="182" y="623" text-anchor="middle">five edits</text>
  <path class="e" d="M182,580 V526" marker-end="url(#notes-arrow)"/>
  <text class="te" x="190" y="558">verify makes each in a copy</text>

  <!-- Legend -->
  <rect class="n you" x="32" y="660" width="16" height="16" rx="3"/>
  <text class="tl" x="58" y="673">yours: the builder can't change it</text>
  <rect class="n code" x="330" y="660" width="16" height="16" rx="3"/>
  <text class="tl" x="356" y="673">the builder's</text>
</svg>
