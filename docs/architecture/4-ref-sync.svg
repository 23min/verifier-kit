<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 812" width="860" height="812">
  <title>How the ref_sync example's files are tied together, with its explorer and Git</title>
  <style>
    :root {
      --surface: #ffffff; --ink: #15202b; --ink-2: #3b4755; --muted: #5a6676;
      --line: #c6ced8; --line-2: #8a96a5;
      --you: #e7e3f7; --you-s: #6556b0;
      --code: #f8e3e8; --code-s: #b0465c;
      --prog: #ddefe3; --prog-s: #2f7a4c;
      --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --surface: #151d26; --ink: #e2e8ee; --ink-2: #b6c1cd; --muted: #95a3b2;
        --line: #33404f; --line-2: #627082;
        --you: #272245; --you-s: #a99df2;
        --code: #3a1d26; --code-s: #ec8fa3;
        --prog: #14291d; --prog-s: #6fc593;
      }
    }
    .bg { fill: var(--surface); stroke: var(--line); }
    .n { fill: var(--surface); stroke: var(--line-2); stroke-width: 1.2; }
    .rim { fill: none; stroke: var(--line-2); stroke-width: 1.2; }
    .n.you { fill: var(--you); stroke: var(--you-s); }
    .n.code { fill: var(--code); stroke: var(--code-s); }
    .n.prog { fill: var(--prog); stroke: var(--prog-s); }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.4; }
    .e.dash { stroke-dasharray: 5 4; }
    .mk { fill: var(--ink-2); }
    .tt { font: 600 14px var(--font-body); fill: var(--ink); }
    .tm { font: 600 14px var(--font-mono); fill: var(--ink); }
    .ts { font: 400 14px var(--font-body); fill: var(--muted); }
    .tl { font: 400 14px var(--font-body); fill: var(--ink-2); }
    /* An edge label carries a halo in the colour beneath it, so a line that
       passes under the text does not strike through it. */
    .te { font: 400 14px var(--font-body); fill: var(--ink-2); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs>
    <marker id="ref-sync-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="mk" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0.5" y="0.5" width="859" height="811" rx="10"/>

  <!-- From prose to the spine -->
  <rect class="n you" x="32" y="20" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="43" text-anchor="middle">spec/ref_sync/chapter.md</text>
  <text class="ts" x="182" y="63" text-anchor="middle">rules, S1-S7, C01-C12</text>
  <path class="e" d="M182,76 V130" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="190" y="108">read by two interpreters</text>

  <rect class="n you" x="32" y="132" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="155" text-anchor="middle">spec/ref_sync/readings/*.yaml</text>
  <text class="ts" x="182" y="175" text-anchor="middle">two readings</text>
  <path class="e" d="M182,188 V242" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="190" y="220">spine diff; a person ratifies</text>

  <rect class="n you" x="544" y="132" width="284" height="56" rx="6"/>
  <text class="tm" x="686" y="155" text-anchor="middle">spec/ref_sync/behaviors/</text>
  <text class="ts" x="686" y="175" text-anchor="middle">valid/ and invalid/</text>
  <path class="e" d="M576,188 V258 H334" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="584" y="228">spine behaviors replays them</text>

  <rect class="n you" x="32" y="244" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="267" text-anchor="middle">spec/ref_sync/spine.yaml</text>
  <text class="ts" x="182" y="287" text-anchor="middle">one operation's lifecycle</text>

  <!-- From the spine to the code -->
  <path class="e" d="M182,300 V354" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="190" y="332">spine conform: every case, margin 1</text>

  <rect class="n you" x="32" y="356" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="379" text-anchor="middle">conformance/adapter_ref_sync.py</text>
  <text class="ts" x="182" y="399" text-anchor="middle">new, apply, observe</text>
  <path class="e" d="M182,412 V466" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="190" y="444">calls transition</text>

  <rect class="n code" x="32" y="468" width="300" height="56" rx="6"/>
  <text class="tm" x="182" y="491" text-anchor="middle">src/ref_sync_client.py</text>
  <text class="ts" x="182" y="511" text-anchor="middle">transition, Client, GitRemote</text>

  <!-- The explorer and its world -->
  <rect class="n you" x="544" y="468" width="284" height="56" rx="6"/>
  <text class="tm" x="686" y="491" text-anchor="middle">checks/ref_sync/world.py</text>
  <text class="ts" x="686" y="511" text-anchor="middle">simulated remote, faults, S1-S5, S7</text>
  <path class="e" d="M810,468 V272 H334" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="693" y="265" text-anchor="middle">reads the states</text>
  <path class="e dash" d="M780,468 V286 H334" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="772" y="340" text-anchor="end">with test_protocol.py, cites the whole</text>
  <text class="te" x="772" y="358" text-anchor="end">spine as covers: spine@hash</text>
  <path class="e" d="M544,490 H334" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="439" y="462" text-anchor="middle">steps two Clients against</text>
  <text class="te" x="439" y="480" text-anchor="middle">a simulated remote</text>

  <rect class="n you" x="544" y="580" width="284" height="56" rx="6"/>
  <text class="tm" x="686" y="603" text-anchor="middle">checks/ref_sync/test_protocol.py</text>
  <text class="ts" x="686" y="623" text-anchor="middle">C01-C08</text>
  <path class="e" d="M640,580 V526" marker-end="url(#ref-sync-arrow)"/>
  <path class="e" d="M686,636 V690" marker-end="url(#ref-sync-arrow)"/>

  <rect class="n you" x="544" y="692" width="284" height="56" rx="6"/>
  <text class="tm" x="686" y="715" text-anchor="middle">checks/ref_sync/explore.py</text>
  <text class="ts" x="686" y="735" text-anchor="middle">breadth-first search</text>

  <!-- The mutants -->
  <rect class="n you" x="322" y="580" width="196" height="56" rx="6"/>
  <text class="tm" x="420" y="603" text-anchor="middle">mutation/mutants.yaml</text>
  <text class="ts" x="420" y="623" text-anchor="middle">six edits</text>
  <path class="e" d="M420,580 V516 H334" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="428" y="556">verify makes each in a copy</text>

  <!-- Git -->
  <path class="n" d="M32,582 A100,6 0 0 1 232,582 V634 A100,6 0 0 1 32,634 Z"/>
  <path class="rim" d="M32,582 A100,6 0 0 0 232,582"/>
  <text class="tt" x="132" y="607" text-anchor="middle">git program</text>
  <text class="ts" x="132" y="626" text-anchor="middle">throwaway repositories</text>
  <path class="e" d="M100,524 V574" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="108" y="556">GitRemote runs</text>

  <rect class="n you" x="32" y="692" width="280" height="56" rx="6"/>
  <text class="tm" x="172" y="715" text-anchor="middle">checks/ref_sync/test_git_ref.py</text>
  <text class="ts" x="172" y="735" text-anchor="middle">C09-C11, S6</text>
  <path class="e" d="M132,692 V642" marker-end="url(#ref-sync-arrow)"/>
  <path class="e" d="M290,692 V526" marker-end="url(#ref-sync-arrow)"/>
  <text class="te" x="298" y="668">publishes with GitRemote</text>

  <!-- Legend -->
  <rect class="n you" x="32" y="772" width="16" height="16" rx="3"/>
  <text class="tl" x="58" y="785">yours: the builder can't change it</text>
  <rect class="n code" x="330" y="772" width="16" height="16" rx="3"/>
  <text class="tl" x="356" y="785">the builder's</text>
</svg>
