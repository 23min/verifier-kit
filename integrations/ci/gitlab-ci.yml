# Example only: copy to .gitlab-ci.yml.
#
# Same job as the GitHub example: it calls ./verify and nothing else. To make it a gate,
# turn on "Pipelines must succeed" for merge requests and protect the default branch
# (both available on GitLab Free). Code Owner approval on protected branches needs
# Premium or Ultimate; on Free, the path guard in ./verify is the substitute, and it is
# only as strong as who may push to which branch names (protect spec/* and build/* too).
verify:
  image: golang:1.27               # ./verify builds spine and verify from tools/ with Go
  variables:
    GIT_DEPTH: "0"                  # full history, so the guard can diff against the base
  before_script:
    - apt-get update -qq && apt-get install -y -qq git python3 python3-yaml > /dev/null
  script:
    - |
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        # The guard runs in merge request pipelines only.
        export VERIFY_BASE="$CI_MERGE_REQUEST_DIFF_BASE_SHA"
        export VERIFY_BRANCH="$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME"
      fi
    - VERIFY_REPORTS=reports ./verify --full
  artifacts:
    when: always
    reports:
      junit: reports/*.xml          # shown in the merge request's test report widget
    paths:
      - reports/
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
