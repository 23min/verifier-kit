# Another reading of seeds/spine.yaml: a state and an event only it has, events listed twice,
# guests let in, removing a guest both refused and allowed, and removing an open door closing it.
machine: door
section: "1.2"
vars:
  role: [owner, guest]
states:
  closed: {kind: fact}
  open: {}
  ajar: {}
  gone: {kind: design, terminal: true}
initial: closed
events: [open, remove, knock, open]
rules:
  - {from: closed, event: open, to: open}
  - {from: closed, event: remove, to: gone}
  - {from: closed, event: remove, when: "role == 'guest'", reject: true}
  - {from: open, event: open, stay: true}
  - {from: open, event: remove, to: closed}
  - {from: ajar, event: knock, to: open}
