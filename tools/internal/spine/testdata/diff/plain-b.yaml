# plain-a.yaml read with no vars key, where a second press breaks the lamp and a drop in the
# dark is undecided: witnesses after one event and after two, with no variables in a step.
machine: lamp
states: {dark: {}, lit: {}, broken: {}}
initial: dark
events: [press, drop]
rules:
  - {from: dark, event: press, to: lit}
  - {from: lit, event: press, to: broken}
  - {from: lit, event: drop, to: broken}
  - {from: broken, event: press, reject: true}
