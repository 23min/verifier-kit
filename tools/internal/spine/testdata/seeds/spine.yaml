# The seed for generated variants: small, sound, and using every part of the format.
machine: door
section: "1.2"
vars:
  role: [owner, guest]
states:
  closed: {kind: fact}
  open: {}
  gone: {kind: design, terminal: true}
initial: closed
events: [open, remove]
rules:
  - {from: closed, event: open, when: "role == 'owner'", to: open}
  - {from: closed, event: open, when: "role != 'owner'", reject: true}
  - {from: closed, event: remove, to: gone}
  - {from: open, event: open, stay: true}
  - {from: open, event: remove, ignore: true}
examples:
  - {name: owner opens, steps: ["open role=owner"], expect: open}
