<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 895" width="860" height="895">
  <title>Machine job, section running-one-job</title>
  <style>
    :root {
      --surface: #ffffff; --ink: #141414; --ink-2: #333333; --muted: #6a6a6a; --rule: #c4c4c4;
      --fact: #b4b4b4; --policy: #dadada; --design: #f2f2f2;
      --serif: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #161616; --ink: #ececec; --ink-2: #cfcfcf; --muted: #9d9d9d; --rule: #444444;
              --fact: #5a5a5a; --policy: #3a3a3a; --design: #242424; }
    }
    .bg, .none { fill: var(--surface); }
    .fact { fill: var(--fact); } .policy { fill: var(--policy); } .design { fill: var(--design); }
    .st { stroke: var(--ink); stroke-width: 1.4; }
    .ring { fill: none; stroke: var(--ink); stroke-width: 1.4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.15; }
    .mk { fill: var(--ink-2); }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .sn { font: italic 400 18px var(--serif); fill: var(--ink); }
    .lb { font: 400 14px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
    .ti { font: 400 17px var(--serif); fill: var(--ink); }
    .tx { font: 400 14px var(--serif); fill: var(--ink); }
    .it { font-style: italic; }
    .nt { font: 400 13px var(--serif); fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk" d="M0,0 L10,4 L0,8 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="895"/>
  <text class="ti" x="24" y="34" text-anchor="start"><tspan x="24" dy="0">Machine job, section running-one-job</tspan></text>
  <text class="tx" x="24" y="58" text-anchor="start"><tspan x="24" dy="0">attempts ∈ {last, some_left}</tspan></text>
  <circle class="st fact" cx="587" cy="52" r="8"/>
  <text class="nt" x="603" y="56" text-anchor="start"><tspan x="603" dy="0">fact: irreversible in the world</tspan></text>
  <circle class="st policy" cx="587" cy="74" r="8"/>
  <text class="nt" x="603" y="78" text-anchor="start"><tspan x="603" dy="0">policy: a business choice</tspan></text>
  <circle class="st design" cx="587" cy="96" r="8"/>
  <text class="nt" x="603" y="100" text-anchor="start"><tspan x="603" dy="0">design: an implementation choice</tspan></text>
  <path class="e" d="M25,220 L69,220" marker-end="url(#arr)"/>
  <g class="move"><title>queued → running</title>
  <path class="e" d="M150,220 Q335,220 516.7,220" marker-end="url(#arr)"/>
  <text class="lb" x="334.2" y="210" text-anchor="middle"><tspan x="334.2" dy="0">start</tspan></text>
  </g>
  <g class="move"><title>queued → discarded</title>
  <path class="e" d="M130.8,254.2 Q222.5,405 309.8,548.5" marker-end="url(#arr)"/>
  <text class="lb" x="247.7" y="392.2" text-anchor="middle"><tspan x="247.7" dy="0">cancel</tspan></text>
  </g>
  <g class="move"><title>running → succeeded</title>
  <path class="e" d="M602.3,220 Q665,220 711.6,220" marker-end="url(#arr)"/>
  <text class="lb" x="661" y="210" text-anchor="middle"><tspan x="661" dy="0">succeed</tspan></text>
  </g>
  <g class="move"><title>running → retrying</title>
  <path class="e" d="M525.4,243 Q447.5,295 373,344.7" marker-end="url(#arr)"/>
  <text class="lb" x="405" y="266" text-anchor="middle"><tspan x="405" dy="0">fail</tspan><tspan x="405" dy="18">[attempts == 'some_left']</tspan></text>
  </g>
  <g class="move"><title>running → discarded</title>
  <path class="e" d="M538.9,254.7 Q447.5,405 360.2,548.5" marker-end="url(#arr)"/>
  <text class="lb" x="522.9" y="435.5" text-anchor="middle"><tspan x="522.9" dy="0">fail</tspan><tspan x="522.9" dy="18">[attempts == 'last']</tspan><tspan x="522.9" dy="18">cancel</tspan></text>
  </g>
  <g class="move"><title>retrying → queued</title>
  <path class="e" d="M297.8,345.2 Q222.5,295 144.1,242.7" marker-end="url(#arr)"/>
  <text class="lb" x="240" y="273" text-anchor="middle"><tspan x="240" dy="0">retry_due</tspan></text>
  </g>
  <g class="move"><title>retrying → discarded</title>
  <path class="e" d="M335,410 Q335,480 335,544" marker-end="url(#arr)"/>
  <text class="lb" x="364.5" y="483.5" text-anchor="middle"><tspan x="364.5" dy="0">cancel</tspan></text>
  </g>
  <ellipse class="st design" cx="110" cy="220" rx="40" ry="40"/>
  <text class="sn" x="110" y="226" text-anchor="middle">queued</text>
  <ellipse class="st design" cx="560" cy="220" rx="42.3" ry="40"/>
  <text class="sn" x="560" y="226" text-anchor="middle">running</text>
  <ellipse class="st policy" cx="335" cy="370" rx="47.3" ry="40"/>
  <text class="sn" x="335" y="376" text-anchor="middle">retrying</text>
  <ellipse class="st fact" cx="770" cy="220" rx="52.4" ry="40"/>
  <ellipse class="ring" cx="770" cy="220" rx="57.4" ry="45"/>
  <text class="sn" x="770" y="226" text-anchor="middle">succeeded</text>
  <ellipse class="st policy" cx="335" cy="590" rx="52.4" ry="40"/>
  <ellipse class="ring" cx="335" cy="590" rx="57.4" ry="45"/>
  <text class="sn" x="335" y="596" text-anchor="middle">discarded</text>
  <text class="nt" x="24" y="675" text-anchor="start"><tspan x="24" dy="0">Every rule that doesn't change the state, by event and state. The moves are the edges above.</tspan><tspan x="24" dy="18">succeeded and discarded are terminal and have no rules.</tspan></text>
  <text class="tx it" x="24" y="723">event</text>
  <text class="tx it" x="118.6" y="723">queued</text>
  <text class="tx it" x="357.7" y="723">running</text>
  <text class="tx it" x="596.9" y="723">retrying</text>
  <line class="rule" x1="24" y1="731" x2="836" y2="731"/>
  <text class="tx" x="24" y="751">start</text>
  <g class="rules"><title>running/start</title>
  <text class="tx" x="357.7" y="751">reject</text>
  </g>
  <g class="rules"><title>retrying/start</title>
  <text class="tx" x="596.9" y="751">reject</text>
  </g>
  <line class="rule" x1="24" y1="759" x2="836" y2="759"/>
  <text class="tx" x="24" y="779">succeed</text>
  <g class="rules"><title>queued/succeed</title>
  <text class="tx" x="118.6" y="779">reject</text>
  </g>
  <g class="rules"><title>retrying/succeed</title>
  <text class="tx" x="596.9" y="779">reject</text>
  </g>
  <line class="rule" x1="24" y1="787" x2="836" y2="787"/>
  <text class="tx" x="24" y="807">fail</text>
  <g class="rules"><title>queued/fail</title>
  <text class="tx" x="118.6" y="807">reject</text>
  </g>
  <g class="rules"><title>retrying/fail</title>
  <text class="tx" x="596.9" y="807">reject</text>
  </g>
  <line class="rule" x1="24" y1="815" x2="836" y2="815"/>
  <text class="tx" x="24" y="835">retry_due</text>
  <g class="rules"><title>queued/retry_due</title>
  <text class="tx" x="118.6" y="835">reject</text>
  </g>
  <g class="rules"><title>running/retry_due</title>
  <text class="tx" x="357.7" y="835">reject</text>
  </g>
  <line class="rule" x1="24" y1="843" x2="836" y2="843"/>
  <text class="tx" x="24" y="863">cancel</text>
</svg>
