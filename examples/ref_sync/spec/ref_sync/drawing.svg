<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 997" width="860" height="997">
  <title>Machine ref_sync, section publishing-one-event</title>
  <style>
    :root {
      --surface: #ffffff; --ink: #141414; --ink-2: #333333; --muted: #6a6a6a; --rule: #c4c4c4;
      --fact: #b4b4b4; --policy: #dadada; --design: #f2f2f2;
      --serif: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --surface: #161616; --ink: #ececec; --ink-2: #cfcfcf; --muted: #9d9d9d; --rule: #444444;
              --fact: #5a5a5a; --policy: #3a3a3a; --design: #242424; }
    }
    .bg, .none { fill: var(--surface); }
    .fact { fill: var(--fact); } .policy { fill: var(--policy); } .design { fill: var(--design); }
    .st { stroke: var(--ink); stroke-width: 1.4; }
    .ring { fill: none; stroke: var(--ink); stroke-width: 1.4; }
    .e { fill: none; stroke: var(--ink-2); stroke-width: 1.15; }
    .mk { fill: var(--ink-2); }
    .rule { stroke: var(--rule); stroke-width: 1; }
    .sn { font: italic 400 18px var(--serif); fill: var(--ink); }
    .lb { font: 400 14px var(--serif); fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round; }
    .ti { font: 400 17px var(--serif); fill: var(--ink); }
    .tx { font: 400 14px var(--serif); fill: var(--ink); }
    .it { font-style: italic; }
    .nt { font: 400 13px var(--serif); fill: var(--muted); }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 8" refX="10" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="mk" d="M0,0 L10,4 L0,8 z"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="860" height="997"/>
  <text class="ti" x="24" y="34" text-anchor="start"><tspan x="24" dy="0">Machine ref_sync, section publishing-one-event</tspan></text>
  <circle class="st fact" cx="587" cy="52" r="8"/>
  <text class="nt" x="603" y="56" text-anchor="start"><tspan x="603" dy="0">fact: irreversible in the world</tspan></text>
  <circle class="st policy" cx="587" cy="74" r="8"/>
  <text class="nt" x="603" y="78" text-anchor="start"><tspan x="603" dy="0">policy: a business choice</tspan></text>
  <circle class="st design" cx="587" cy="96" r="8"/>
  <text class="nt" x="603" y="100" text-anchor="start"><tspan x="603" dy="0">design: an implementation choice</tspan></text>
  <path class="e" d="M55,340 L99,340" marker-end="url(#arr)"/>
  <g class="move"><title>queued → prepared</title>
  <path class="e" d="M179.5,334 Q423.2,297 638.3,190.6" marker-end="url(#arr)"/>
  <text class="lb" x="422.9" y="306.4" text-anchor="middle"><tspan x="422.9" dy="0">prepare</tspan></text>
  </g>
  <g class="move"><title>queued → confirmed</title>
  <path class="e" d="M179.6,345.7 Q295,362.5 392.6,376.7" marker-end="url(#arr)"/>
  <text class="lb" x="293.8" y="344.3" text-anchor="middle"><tspan x="293.8" dy="0">seen_on_remote</tspan></text>
  </g>
  <g class="move"><title>queued → protocol_error</title>
  <path class="e" d="M140,380 Q140,460 140,534" marker-end="url(#arr)"/>
  <text class="lb" x="204.8" y="463.5" text-anchor="middle"><tspan x="204.8" dy="0">digest_mismatch</tspan></text>
  </g>
  <g class="move"><title>queued → conflicted</title>
  <path class="e" d="M140,300 Q140,240 140,186" marker-end="url(#arr)"/>
  <text class="lb" x="90.9" y="246.5" text-anchor="middle"><tspan x="90.9" dy="0">invalidated</tspan></text>
  </g>
  <g class="move"><title>prepared → confirmed</title>
  <path class="e" d="M648.3,199.7 Q565,277.5 487.6,349.8" marker-end="url(#arr)"/>
  <text class="lb" x="589.7" y="306" text-anchor="middle"><tspan x="589.7" dy="0">accepted</tspan></text>
  </g>
  <g class="move"><title>prepared → queued</title>
  <path class="e" d="M633.4,177.1 Q396.8,213 176.8,321.8" marker-end="url(#arr)"/>
  <text class="lb" x="388.3" y="187.2" text-anchor="middle"><tspan x="388.3" dy="0">non_fast_forward</tspan><tspan x="388.3" dy="18">restart</tspan></text>
  </g>
  <g class="move"><title>prepared → uncertain</title>
  <path class="e" d="M680,210 Q680,345 680,479" marker-end="url(#arr)"/>
  <text class="lb" x="737" y="349.8" text-anchor="middle"><tspan x="737" dy="0">response_lost</tspan></text>
  </g>
  <g class="move"><title>uncertain → confirmed</title>
  <path class="e" d="M638.5,495.6 Q565,452.5 496.8,412.5" marker-end="url(#arr)"/>
  <text class="lb" x="615" y="430" text-anchor="middle"><tspan x="615" dy="0">seen_on_remote</tspan></text>
  </g>
  <g class="move"><title>uncertain → queued</title>
  <path class="e" d="M632,504 Q410,430 178.9,353" marker-end="url(#arr)"/>
  <text class="lb" x="394.2" y="466" text-anchor="middle"><tspan x="394.2" dy="0">absent_on_remote</tspan><tspan x="394.2" dy="18">restart</tspan></text>
  </g>
  <g class="move"><title>uncertain → protocol_error</title>
  <path class="e" d="M628.2,525.8 Q410,550 221.9,570.9" marker-end="url(#arr)"/>
  <text class="lb" x="419.9" y="575.5" text-anchor="middle"><tspan x="419.9" dy="0">digest_mismatch</tspan></text>
  </g>
  <ellipse class="st design" cx="140" cy="340" rx="40" ry="40"/>
  <text class="sn" x="140" y="346" text-anchor="middle">queued</text>
  <ellipse class="st design" cx="680" cy="170" rx="47.3" ry="40"/>
  <text class="sn" x="680" y="176" text-anchor="middle">prepared</text>
  <ellipse class="st design" cx="680" cy="520" rx="52.4" ry="40"/>
  <text class="sn" x="680" y="526" text-anchor="middle">uncertain</text>
  <ellipse class="st fact" cx="450" cy="385" rx="52.4" ry="40"/>
  <ellipse class="ring" cx="450" cy="385" rx="57.4" ry="45"/>
  <text class="sn" x="450" y="391" text-anchor="middle">confirmed</text>
  <ellipse class="st policy" cx="140" cy="140" rx="57.4" ry="40"/>
  <ellipse class="ring" cx="140" cy="140" rx="62.4" ry="45"/>
  <text class="sn" x="140" y="146" text-anchor="middle">conflicted</text>
  <ellipse class="st policy" cx="140" cy="580" rx="77.6" ry="40"/>
  <ellipse class="ring" cx="140" cy="580" rx="82.6" ry="45"/>
  <text class="sn" x="140" y="586" text-anchor="middle">protocol_error</text>
  <text class="nt" x="24" y="665" text-anchor="start"><tspan x="24" dy="0">Every rule that doesn't change the state, by event and state. The moves are the edges above.</tspan><tspan x="24" dy="18">confirmed, conflicted and protocol_error are terminal and have no rules.</tspan></text>
  <text class="tx it" x="24" y="713">event</text>
  <text class="tx it" x="173.4" y="713">queued</text>
  <text class="tx it" x="394.3" y="713">prepared</text>
  <text class="tx it" x="615.1" y="713">uncertain</text>
  <line class="rule" x1="24" y1="721" x2="836" y2="721"/>
  <text class="tx" x="24" y="741">prepare</text>
  <g class="rules"><title>prepared/prepare</title>
  <text class="tx" x="394.3" y="741">reject</text>
  </g>
  <g class="rules"><title>uncertain/prepare</title>
  <text class="tx" x="615.1" y="741">reject</text>
  </g>
  <line class="rule" x1="24" y1="749" x2="836" y2="749"/>
  <text class="tx" x="24" y="769">accepted</text>
  <g class="rules"><title>queued/accepted</title>
  <text class="tx" x="173.4" y="769">reject</text>
  </g>
  <g class="rules"><title>uncertain/accepted</title>
  <text class="tx" x="615.1" y="769">reject</text>
  </g>
  <line class="rule" x1="24" y1="777" x2="836" y2="777"/>
  <text class="tx" x="24" y="797">non_fast_forward</text>
  <g class="rules"><title>queued/non_fast_forward</title>
  <text class="tx" x="173.4" y="797">reject</text>
  </g>
  <g class="rules"><title>uncertain/non_fast_forward</title>
  <text class="tx" x="615.1" y="797">reject</text>
  </g>
  <line class="rule" x1="24" y1="805" x2="836" y2="805"/>
  <text class="tx" x="24" y="825">response_lost</text>
  <g class="rules"><title>queued/response_lost</title>
  <text class="tx" x="173.4" y="825">reject</text>
  </g>
  <g class="rules"><title>uncertain/response_lost</title>
  <text class="tx" x="615.1" y="825">reject</text>
  </g>
  <line class="rule" x1="24" y1="833" x2="836" y2="833"/>
  <text class="tx" x="24" y="853">seen_on_remote</text>
  <g class="rules"><title>prepared/seen_on_remote</title>
  <text class="tx" x="394.3" y="853">reject</text>
  </g>
  <line class="rule" x1="24" y1="861" x2="836" y2="861"/>
  <text class="tx" x="24" y="881">absent_on_remote</text>
  <g class="rules"><title>queued/absent_on_remote</title>
  <text class="tx" x="173.4" y="881">stay</text>
  </g>
  <g class="rules"><title>prepared/absent_on_remote</title>
  <text class="tx" x="394.3" y="881">reject</text>
  </g>
  <line class="rule" x1="24" y1="889" x2="836" y2="889"/>
  <text class="tx" x="24" y="909">digest_mismatch</text>
  <g class="rules"><title>prepared/digest_mismatch</title>
  <text class="tx" x="394.3" y="909">reject</text>
  </g>
  <line class="rule" x1="24" y1="917" x2="836" y2="917"/>
  <text class="tx" x="24" y="937">invalidated</text>
  <g class="rules"><title>prepared/invalidated</title>
  <text class="tx" x="394.3" y="937">reject</text>
  </g>
  <g class="rules"><title>uncertain/invalidated</title>
  <text class="tx" x="615.1" y="937">reject</text>
  </g>
  <line class="rule" x1="24" y1="945" x2="836" y2="945"/>
  <text class="tx" x="24" y="965">restart</text>
  <g class="rules"><title>queued/restart</title>
  <text class="tx" x="173.4" y="965">stay</text>
  </g>
</svg>
