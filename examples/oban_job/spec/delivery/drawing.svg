  </g>
  <g class="move"><title>scheduled_2 → completed</title>
  <path class="e" d="M381.2,1225.1 Q166.7,1115.5 102.1,875" marker-end="url(#arr)"/>
  <text class="lb" x="213" y="1074" text-anchor="middle"><tspan x="213" dy="0">wait</tspan><tspan x="213" dy="18">[answer == 'accepted']</tspan></text>
