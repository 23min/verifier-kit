  <text class="lb" x="263" y="578" text-anchor="middle"><tspan x="263" dy="0">wait</tspan><tspan x="263" dy="18">[answer == 'accepted']</tspan></text>
  </g>
  <g class="move"><title>scheduled_0 → retryable_1</title>
