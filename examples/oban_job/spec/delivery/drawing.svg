  </g>
  <g class="move"><title>scheduled_1 → completed</title>
  <path class="e" d="M384,802.9 Q260,730 136.8,802.5" marker-end="url(#arr)"/>
  <text class="lb" x="230" y="746" text-anchor="middle"><tspan x="230" dy="0">wait</tspan><tspan x="230" dy="18">[answer == 'accepted']</tspan></text>
  </g>
  <g class="move"><title>scheduled_1 → retryable_2</title>
