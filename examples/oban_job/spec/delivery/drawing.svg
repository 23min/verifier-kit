  <path class="e" d="M367.6,620.8 Q196.9,622.9 112,787.4" marker-end="url(#arr)"/>
  <text class="lb" x="238" y="680" text-anchor="middle"><tspan x="238" dy="0">wait</tspan><tspan x="238" dy="18">[answer == 'accepted']</tspan></text>
  </g>
