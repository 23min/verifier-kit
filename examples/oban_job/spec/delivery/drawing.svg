  <g class="move"><title>scheduled_2 → cancelled</title>
  <path class="e" d="M479.3,1225.4 Q697.2,1116.8 767.1,874.8" marker-end="url(#arr)"/>
  <text class="lb" x="726.6" y="1125.9" text-anchor="middle"><tspan x="726.6" dy="0">wait</tspan><tspan x="726.6" dy="18">[answer == 'bounced']</tspan><tspan x="726.6" dy="18">cancel</tspan></text>
  </g>
  <ellipse class="st design" cx="430" cy="200" rx="62.4" ry="40"/>
  <text class="sn" x="430" y="206" text-anchor="middle">available_0</text>
  <ellipse class="st policy" cx="430" cy="620" rx="62.4" ry="40"/>
  <text class="sn" x="430" y="626" text-anchor="middle">retryable_1</text>
  <ellipse class="st policy" cx="430" cy="1040" rx="62.4" ry="40"/>
  <text class="sn" x="430" y="1046" text-anchor="middle">retryable_2</text>
  <ellipse class="st policy" cx="430" cy="410" rx="62.4" ry="40"/>
  <text class="sn" x="430" y="416" text-anchor="middle">scheduled_0</text>
  <ellipse class="st policy" cx="430" cy="830" rx="62.4" ry="40"/>
  <text class="sn" x="430" y="836" text-anchor="middle">scheduled_1</text>
  <ellipse class="st policy" cx="430" cy="1250" rx="62.4" ry="40"/>
  <text class="sn" x="430" y="1256" text-anchor="middle">scheduled_2</text>
  <ellipse class="st fact" cx="90" cy="830" rx="52.4" ry="40"/>
  <ellipse class="ring" cx="90" cy="830" rx="57.4" ry="45"/>
  <text class="sn" x="90" y="836" text-anchor="middle">completed</text>
  <ellipse class="st policy" cx="780" cy="830" rx="52.4" ry="40"/>
  <ellipse class="ring" cx="780" cy="830" rx="57.4" ry="45"/>
  <text class="sn" x="780" y="836" text-anchor="middle">cancelled</text>
  <ellipse class="st policy" cx="430" cy="1460" rx="52.4" ry="40"/>
  <ellipse class="ring" cx="430" cy="1460" rx="57.4" ry="45"/>
  <text class="sn" x="430" y="1466" text-anchor="middle">discarded</text>
  <text class="nt" x="24" y="1545" text-anchor="start"><tspan x="24" dy="0">Every rule that doesn't change the state, by event and state. The moves are the edges above.</tspan><tspan x="24" dy="18">completed, cancelled and discarded are terminal and have no rules.</tspan></text>
  <text class="tx it" x="24" y="1593">event</text>
  <text class="tx it" x="95" y="1593">retryable_1</text>
  <text class="tx it" x="465.5" y="1593">retryable_2</text>
  <line class="rule" x1="24" y1="1601" x2="836" y2="1601"/>
  <text class="tx" x="24" y="1621">run</text>
  <g class="rules"><title>retryable_1/run</title>
  <text class="tx" x="95" y="1621">ignore</text>
  </g>
  <g class="rules"><title>retryable_2/run</title>
  <text class="tx" x="465.5" y="1621">ignore</text>
  </g>
  <line class="rule" x1="24" y1="1629" x2="836" y2="1629"/>
  <text class="tx" x="24" y="1649">wait</text>
  <line class="rule" x1="24" y1="1657" x2="836" y2="1657"/>
  <text class="tx" x="24" y="1677">cancel</text>
  <text class="tx it" x="24" y="1715">event</text>
  <text class="tx it" x="95" y="1715">scheduled_0</text>
  <text class="tx it" x="465.5" y="1715">scheduled_1</text>
  <line class="rule" x1="24" y1="1723" x2="836" y2="1723"/>
  <text class="tx" x="24" y="1743">run</text>
  <g class="rules"><title>scheduled_0/run</title>
  <text class="tx" x="95" y="1743">ignore</text>
  </g>
  <g class="rules"><title>scheduled_1/run</title>
  <text class="tx" x="465.5" y="1743">ignore</text>
  </g>
  <line class="rule" x1="24" y1="1751" x2="836" y2="1751"/>
  <text class="tx" x="24" y="1771">wait</text>
  <g class="rules"><title>scheduled_0/wait</title>
  <text class="tx" x="95" y="1771">stay [answer == 'rate_limited']</text>
  </g>
  <g class="rules"><title>scheduled_1/wait</title>
  <text class="tx" x="465.5" y="1771">stay [answer == 'rate_limited']</text>
  </g>
  <line class="rule" x1="24" y1="1779" x2="836" y2="1779"/>
  <text class="tx" x="24" y="1799">cancel</text>
  <text class="tx it" x="24" y="1837">event</text>
  <text class="tx it" x="95" y="1837">scheduled_2</text>
  <line class="rule" x1="24" y1="1845" x2="836" y2="1845"/>
  <text class="tx" x="24" y="1865">run</text>
  <g class="rules"><title>scheduled_2/run</title>
  <text class="tx" x="95" y="1865">ignore</text>
  </g>
  <line class="rule" x1="24" y1="1873" x2="836" y2="1873"/>
  <text class="tx" x="24" y="1893">wait</text>
  <g class="rules"><title>scheduled_2/wait</title>
  <text class="tx" x="95" y="1893">stay [answer == 'rate_limited']</text>
