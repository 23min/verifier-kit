  <text class="lb" x="626" y="661" text-anchor="middle"><tspan x="626" dy="0">wait</tspan><tspan x="626" dy="18">[answer == 'bounced']</tspan><tspan x="626" dy="18">cancel</tspan></text>
  </g>
