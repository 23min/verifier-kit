machine: delivery
vars:
  answer: [accepted, failed, bounced, rate_limited]
states:
  available_0: {kind: policy}
  retryable_1: {kind: policy}
  retryable_2: {kind: policy}
  scheduled_0: {kind: policy}
  scheduled_1: {kind: policy}
  scheduled_2: {kind: policy}
  completed: {kind: fact, terminal: true}
  cancelled: {kind: fact, terminal: true}
  discarded: {kind: fact, terminal: true}
initial: available_0
events: [run, wait, cancel]
outputs: [send_mail]
rules:
  # available_0
  - {from: available_0, event: run, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: available_0, event: run, when: "answer == 'failed'", to: retryable_1, outputs: [send_mail]}
  - {from: available_0, event: run, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: available_0, event: run, when: "answer == 'rate_limited'", to: scheduled_0, outputs: [send_mail]}
  - {from: available_0, event: wait, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: available_0, event: wait, when: "answer == 'failed'", to: retryable_1, outputs: [send_mail]}
  - {from: available_0, event: wait, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: available_0, event: wait, when: "answer == 'rate_limited'", to: scheduled_0, outputs: [send_mail]}
  - {from: available_0, event: cancel, to: cancelled, outputs: []}
  # retryable_1
  - {from: retryable_1, event: run, ignore: true}
  - {from: retryable_1, event: wait, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: retryable_1, event: wait, when: "answer == 'failed'", to: retryable_2, outputs: [send_mail]}
  - {from: retryable_1, event: wait, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: retryable_1, event: wait, when: "answer == 'rate_limited'", to: scheduled_1, outputs: [send_mail]}
  - {from: retryable_1, event: cancel, to: cancelled, outputs: []}
  # retryable_2
  - {from: retryable_2, event: run, ignore: true}
  - {from: retryable_2, event: wait, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: retryable_2, event: wait, when: "answer == 'failed'", to: discarded, outputs: [send_mail]}
  - {from: retryable_2, event: wait, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: retryable_2, event: wait, when: "answer == 'rate_limited'", to: scheduled_2, outputs: [send_mail]}
  - {from: retryable_2, event: cancel, to: cancelled, outputs: []}
  # scheduled_0
  - {from: scheduled_0, event: run, ignore: true}
  - {from: scheduled_0, event: wait, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: scheduled_0, event: wait, when: "answer == 'failed'", to: retryable_1, outputs: [send_mail]}
  - {from: scheduled_0, event: wait, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: scheduled_0, event: wait, when: "answer == 'rate_limited'", stay: true, outputs: [send_mail]}
  - {from: scheduled_0, event: cancel, to: cancelled, outputs: []}
  # scheduled_1
  - {from: scheduled_1, event: run, ignore: true}
  - {from: scheduled_1, event: wait, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: scheduled_1, event: wait, when: "answer == 'failed'", to: retryable_2, outputs: [send_mail]}
  - {from: scheduled_1, event: wait, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: scheduled_1, event: wait, when: "answer == 'rate_limited'", stay: true, outputs: [send_mail]}
  - {from: scheduled_1, event: cancel, to: cancelled, outputs: []}
  # scheduled_2
  - {from: scheduled_2, event: run, ignore: true}
  - {from: scheduled_2, event: wait, when: "answer == 'accepted'", to: completed, outputs: [send_mail]}
  - {from: scheduled_2, event: wait, when: "answer == 'failed'", to: discarded, outputs: [send_mail]}
  - {from: scheduled_2, event: wait, when: "answer == 'bounced'", to: cancelled, outputs: [send_mail]}
  - {from: scheduled_2, event: wait, when: "answer == 'rate_limited'", stay: true, outputs: [send_mail]}
  - {from: scheduled_2, event: cancel, to: cancelled, outputs: []}
