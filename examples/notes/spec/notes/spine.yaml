# The lifecycle of one note (chapter.md, section 2). Built on 2026-10-25 from readings/ and the
# owner's answers in #60: the spine as first ratified, which decides each of the 15 cases the
# readings disagree on. Its answers: only published notes can be trashed; only the owner restores
# and purges; viewers cannot edit. Ratified by the reviewed merge of this file.
machine: note
section: trash
vars:
  role: [owner, editor, viewer]
states:
  draft:   {kind: policy}
  active:  {kind: policy}
  trashed: {kind: design}
  purged:  {kind: fact, terminal: true}
initial: draft
events: [publish, edit, trash, restore, purge]
rules:
  - {from: draft, event: publish, when: "role == 'owner'", to: active}
  - {from: draft, event: publish, when: "role != 'owner'", reject: true}
  - {from: draft, event: edit, when: "role != 'viewer'", stay: true}
  - {from: draft, event: edit, when: "role == 'viewer'", reject: true}
  - {from: draft, event: trash, reject: true}
  - {from: draft, event: restore, when: "role == 'owner'", ignore: true}
  - {from: draft, event: restore, when: "role != 'owner'", reject: true}
  - {from: draft, event: purge, reject: true}

  - {from: active, event: publish, when: "role == 'owner'", ignore: true}
  - {from: active, event: publish, when: "role != 'owner'", reject: true}
  - {from: active, event: edit, when: "role != 'viewer'", stay: true}
  - {from: active, event: edit, when: "role == 'viewer'", reject: true}
  - {from: active, event: trash, when: "role == 'owner'", to: trashed}
  - {from: active, event: trash, when: "role != 'owner'", reject: true}
  - {from: active, event: restore, when: "role == 'owner'", ignore: true}
  - {from: active, event: restore, when: "role != 'owner'", reject: true}
  - {from: active, event: purge, reject: true}

  - {from: trashed, event: publish, reject: true}
  - {from: trashed, event: edit, reject: true}
  - {from: trashed, event: trash, when: "role == 'owner'", ignore: true}
  - {from: trashed, event: trash, when: "role != 'owner'", reject: true}
  - {from: trashed, event: restore, when: "role == 'owner'", to: active}
  - {from: trashed, event: restore, when: "role != 'owner'", reject: true}
  - {from: trashed, event: purge, when: "role == 'owner'", to: purged}
  - {from: trashed, event: purge, when: "role != 'owner'", reject: true}
