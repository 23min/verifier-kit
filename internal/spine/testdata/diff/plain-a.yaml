# No variables: an empty list counts as none, as in tools/spine.py.
machine: lamp
vars: []
states: {off: {}, on: {}, broken: {}}
initial: off
events: [press, drop]
rules:
  - {from: off, event: press, to: on}
  - {from: on, event: press, to: off}
  - {from: off, event: drop, to: broken}
  - {from: on, event: drop, to: broken}
  - {from: broken, event: press, reject: true}
