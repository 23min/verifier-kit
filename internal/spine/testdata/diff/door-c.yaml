# seeds/spine.yaml with its events in another order and one listed twice, and a state it lacks.
machine: door
vars:
  role: [owner, guest]
states:
  closed: {}
  open: {}
initial: closed
events: [remove, open, open]
rules:
  - {from: closed, event: open, when: "role == 'owner'", to: open}
  - {from: closed, event: open, when: "role != 'owner'", reject: true}
  - {from: closed, event: remove, stay: true}
  - {from: open, event: open, stay: true}
  - {from: open, event: remove, ignore: true}
