# The toolkit's own gate: the sample oracle must hold (./verify --full), every seeded fault
# must be caught (demo/faults.sh), and the Go spine must give what its record holds (go test).
# Make the "verify" job a required check on main.
name: verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/go.mod
          cache-dependency-path: tools/go.sum

      # The elixir_job example's adapter, checks and mutation run with elixir (1.18+ for JSON).
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"

      - run: go -C tools vet ./...

      - name: Go spine against its record
        run: go -C tools test ./...

      - name: verify
        shell: bash
        env:
          VERIFY_REPORTS: reports
        run: |
          {
            echo '```'
            ./verify --full && status=0 || status=$?
            echo '```'
            exit "$status"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: seeded faults
        shell: bash
        run: demo/faults.sh

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: verify-reports
          path: reports/
          if-no-files-found: ignore
